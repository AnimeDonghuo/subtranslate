name: Tests and container smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check subtranslate tests
      - run: python -m playwright install --with-deps chromium
      - name: Run unit tests and real-browser mock-site tests
        shell: bash
        run: |
          export TEST_CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m pytest -q

  container-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build -t subtranslate-ci .
      - name: Run a full mocked bot flow with free-instance limits
        run: |
          docker run --rm --network none --memory 512000000 --memory-swap 512000000 --cpus 0.1 \
            --mount type=bind,source="$PWD/tests",target=/smoke,readonly \
            --env PYTHONPATH=/app subtranslate-ci python /smoke/resource_smoke.py
